name: Checks

# **The checks. All of them, in the one place that runs them.**
#
# `pnpm run check` is the chain — `tsc`, `typecheck:test`, and every
# `check:*` from `check:text` to `check:arrival-completes`. It used to live
# inside `pnpm run build`, which meant every consumer of "build" paid for the
# whole gate: the deploy re-ran 16 minutes of QA to produce a 191 ms artefact,
# on a commit that had already passed those very checks minutes earlier.
#
# Jim, 30 August 2026: *"why would we EVER run tests on a deploy to start
# with?"* and *"this is very simple — build and check are different things."*
# So they are now two scripts, and this workflow owns the checking one.
#
# ## This workflow is a REQUIRED status check on `main`, and must stay one
#
# That is not decoration, it is the whole design. Moving the checks out of
# `build` means the deploy no longer runs them and the PR preview no longer
# runs them — **this workflow is now the only thing that makes them run at
# all.** If it stops being required, the checks are still executing but
# nothing is gating on them, and a red one merges. That failure is silent in
# the worst way: every PR goes green *faster*, which looks like an
# improvement.
#
# So if you rename the **`Checks` aggregator job** (below), update the branch
# protection in the same change — a required check is matched by **job name**,
# and a name that matches nothing gates nothing. Verify by reading it back:
#
#     gh api repos/jimhigson/land-of-good-places/branches/main/protection
#
# ## Why its own file rather than a job bolted onto something else
#
# Same reasoning `procgen-invariants.yml` already gives for splitting its
# invariant suite into its own job: a failure should read as *"a check broke"*
# on its own line, not be buried in the log of something called "build".
# ## Why it is split into shards, and what keeps that honest
#
# The chain outgrew one runner. On `feat/procgen-on-sphere` it needs ~35-50
# minutes end to end — most steps there build a park, ~40 s each on CI — and the
# single job was being killed by its watchdog at 27m00s with 48 of 68 steps
# done. **Raising the cap was the wrong fix**: a cap stretched to fit a slow job
# is what caused the 29 August outage. So the chain is split into contiguous
# `check:shard-N` scripts in `package.json`, and this workflow runs one per
# runner, in parallel: the wall clock is now the longest shard, not the sum.
#
# Three things make that safe rather than merely fast:
#
# 1. **`pnpm run check` is still the whole gate**, locally: its body is
#    `check:shard-1 && ... && check:shard-N`, in the original order. The shards
#    are not a second definition of the chain, they *are* the chain.
# 2. **`check:chain-coverage` proves the partition on every run** — each step
#    in exactly one shard, and every shard named by this file's matrix. Drop a
#    shard from the matrix below, or a step into two shards, and it goes red.
# 3. **The required check is still one job called `Checks`** — the aggregator
#    at the bottom, which `needs:` every shard and the build and fails unless
#    every one of them *succeeded*. It runs `if: always()`, and that is
#    load-bearing: without it a failed shard would make GitHub **skip** the
#    aggregator, and **a skipped required check counts as passing**.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shards:
    # Not the required check — the aggregator below is. These names are what
    # `measure:check-chain` reads a log's cap by, so keep the template.
    name: Checks shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # **Each shard's cap, and the watchdog reads it from here** (`--job
    # shards` in `check:watchdog`), so there is one number, not two.
    #
    # Shards are balanced to ~9-10 minutes on a slow runner (see the PR that
    # split them for the per-step CI durations), so 30 is ~3x headroom, not a
    # cap sitting just above the real duration. That gap is the point: a job
    # killed by `timeout-minutes` reports as `cancelled`, which reads
    # identically to a concurrency kill and so fails silently.
    timeout-minutes: 30
    strategy:
      # Every shard runs to its own verdict. With fail-fast one red shard
      # cancels the rest, and a cancelled shard says nothing about its steps.
      fail-fast: false
      matrix:
        # Must name every `check:shard-N` in package.json, each once —
        # `check:chain-coverage` fails if it does not.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        # Version comes from `packageManager` in package.json, so there is one
        # place to bump it rather than one per workflow.
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # The repo declares its Node once, in `.node-version`, which is also what
          # `fnm use` reads locally. Read it here rather than restating 26 in each of
          # the seven workflows (#506).
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        # Registry hiccups are common enough to be worth retrying; the counts
        # live in `.npmrc`, which pnpm reads.
        run: pnpm install --frozen-lockfile

      # `check:served-walking` and `check:served-deep-links` drive a real page.
      # `playwright-core` ships the driver but not the browser binaries.
      # Installed on every shard rather than only the one that holds
      # those today: tying it to a shard number would be a second
      # definition of where that step lives, kept in step by hand.
      - name: Install Chromium
        run: pnpm exec playwright-core install --with-deps chromium

      # One shard of the gate, **under a watchdog, not directly.** The
      # watchdog runs `pnpm run check:shard-N` under a clock set inside this
      # job's `timeout-minutes`. Two things that buys:
      #
      # 1. **A timeout becomes red.** If `timeout-minutes` fires, GitHub marks
      #    the job `cancelled` — grey, and identical to a superseded push. The
      #    watchdog gets there first and exits 124, so the job is a `failure`
      #    with a message naming the step that was running.
      # 2. **The margin is printed on every run, pass or fail**, per shard.
      #
      # `scripts/measure-check-chain.mts` is the tool for the "after" case:
      # `gh run view <run-id> --log > run.log && pnpm run measure:check-chain run.log`.
      - name: Run this shard of the checks
        run: pnpm run check:watchdog check:shard-${{ matrix.shard }}

  build:
    name: Checks build
    runs-on: ubuntu-latest
    # Install plus a sub-second `vite build`; 10 minutes is only a backstop.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `vite build` on its own, kept here deliberately.
      #
      # `pnpm run check` typechecks, but **`vite build` does not** — it strips
      # types via esbuild and never consults `tsc`. The two therefore catch
      # different things: `tsc` sees type errors, and the bundler sees the ones
      # only linking can reveal (an unresolved import, a bad asset reference, a
      # plugin that throws). "A broken build never ships" has been the rule in
      # `DEPLOY_NOTES.md` since 2026-07-26, and this is the step that keeps it
      # true now that the deploy no longer builds-and-checks in one go.
      - name: Build the artefact
        run: pnpm run build

  check:
    # **This string is the required status check on `main`.** Changing it
    # silently stops gating merges. See the header.
    name: Checks
    needs: [shards, build]
    # `always()`, never the default. A job whose `needs` failed is SKIPPED by
    # default, and GitHub treats a skipped required check as satisfied — so
    # without this line a red shard would produce a green gate.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard and the build succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          # The control: if `needs` ever arrives empty (a renamed job, a bad
          # expression), "no job failed" would be vacuously true. Count them.
          count=$(echo "$NEEDS" | jq 'length')
          if [ "$count" != "2" ]; then
            echo "::error::expected 2 upstream jobs (shards, build), saw $count — the aggregator is measuring nothing"
            exit 1
          fi
          # `success` only. `failure`, `cancelled` (a shard's own timeout) and
          # `skipped` are all a gate that did not pass.
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::not every part of the gate succeeded: $bad"
            exit 1
          fi
          echo "Checks ok — every shard and the build succeeded."
