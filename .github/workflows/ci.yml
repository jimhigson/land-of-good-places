name: CI

# **Everything that builds a park, in one run, beside one Parks validation.**
#
# The solved parks are checked in (`parks/`, docs/design/PREBUILT-PARKS.md
# "Checked in"), so every job below reads them straight from its checkout and
# starts at once: nothing is solved, restored or waited for. `parks.yml`
# validates them — hydrates each seed's file with this commit's code and asks
# it the acceptance a fresh solve gets, one seed per runner.
#
# **A rejected park must not merge and must not deploy**, so:
#
# - the two required aggregators at the bottom `needs:` the Parks validation
#   as well as their own shards, and are red if it is;
# - the PR preview and the deploy `needs:` it and run only on its success.
#
# The other consumers do not wait for it. If a change breaks how a park
# hydrates, many of them go red at once; the Parks job for a seed is the one
# whose message says what happened and what to run.
#
# (This file exists as one workflow because a workflow cannot `needs:` a job in
# another one: the consumers used to be eight separate workflows each polling
# the API for a Parks build, and on 2 Oct 2026 that exhausted the
# installation's rate limit — HTTP 403, PR #705. Each consumer keeps its own
# file — its jobs, caps and the long comments explaining them; this file only
# wires them together.)
#
# **The two required status checks live here, at the top level**, because a
# job inside a called workflow is reported as "<caller job> / <job>" and a
# required check is matched by exact name. `Checks` and `Procgen invariants`
# below are those names; renaming either stops it gating merges with nothing
# going red. Read them back with
#
#     gh api repos/jimhigson/land-of-good-places/branches/main/protection
#
# `update-adoption.yml` and `live-version.yml` build no park and stay separate.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A PR's superseded run is cancelled. A push to main is never cancelled: each
# commit is its own group, because this run deploys, and a cancelled deploy is
# the 29 August outage (the deploy job also queues on `deploy-main` itself).
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parks:
    name: Parks
    uses: ./.github/workflows/parks.yml

  # No consumer waits for Parks: each reads the checked-in `parks/` from its
  # own checkout. The two required aggregators below are what hold a rejected
  # park back from merging.
  checks:
    name: Checks parts
    uses: ./.github/workflows/checks.yml

  procgen:
    name: Procgen invariants parts
    uses: ./.github/workflows/procgen-invariants.yml

  coplanar:
    name: Coplanar faces
    uses: ./.github/workflows/coplanar.yml

  entrance-road:
    name: Entrance road
    uses: ./.github/workflows/entrance-road.yml

  every-seed-builds:
    name: Every seed builds
    uses: ./.github/workflows/every-seed-builds.yml

  swept-bus:
    name: Swept bus
    uses: ./.github/workflows/swept-bus.yml

  walk-reach:
    name: Walk reach
    uses: ./.github/workflows/walk-reach.yml

  preview:
    name: PR preview
    needs: [parks]
    # Only once every checked-in park is accepted by this commit: a preview is
    # handed to Jim as the work itself, and a rejected park is not that.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.parks.result == 'success' }}
    uses: ./.github/workflows/pr-preview.yml
    secrets: inherit
    permissions:
      contents: read
      # The preview link is a PR conversation comment: the Issues API.
      issues: write
      pull-requests: write

  deploy:
    name: Deploy
    needs: [parks]
    # A push to main, or by hand on main (`gh workflow run ci.yml --ref main`).
    # **Never with a rejected park**: `needs.parks.result` is `success` only
    # when all sixteen validate jobs passed for this exact commit — including a
    # direct push to main, which no PR gate ever saw.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.parks.result == 'success' }}
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  # **This string is a required status check on `main`.** See the header.
  check:
    name: Checks
    # `parks` too: a commit whose checked-in parks this source rejects must not
    # merge, whatever its shards say.
    needs: [checks, parks]
    # `always()`, never the default. A job whose `needs` failed is SKIPPED by
    # default, and GitHub treats a skipped required check as satisfied — so
    # without this line a red shard would produce a green gate.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard and the build succeeded, and every park is still accepted
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          # The control: if `needs` ever arrives short (a renamed job, a bad
          # expression), "no job failed" would be vacuously true. Count them.
          count=$(echo "$NEEDS" | jq 'length')
          if [ "$count" != "2" ]; then
            echo "::error::expected 2 upstream jobs (checks, parks), saw $count — the aggregator is not measuring what it claims"
            exit 1
          fi
          # `success` only. `failure` (a red shard, a rejected park),
          # `cancelled` (a shard's own timeout) and `skipped` are all a gate
          # that did not pass.
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::not every part of the gate succeeded: $bad (if 'parks' is among them, the 'Park N still accepted' job for the rejected seed says the clause and what to run)"
            exit 1
          fi
          echo "Checks ok — every shard and the build succeeded, and this commit accepts all sixteen checked-in parks."

  # **This string is a required status check on `main`.** See the header.
  invariants:
    name: Procgen invariants
    needs: [procgen, parks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard of the suite succeeded, and every park is still accepted
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          count=$(echo "$NEEDS" | jq 'length')
          if [ "$count" != "2" ]; then
            echo "::error::expected 2 upstream jobs (procgen, parks), saw $count — the aggregator is not measuring what it claims"
            exit 1
          fi
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::not every part of the procgen gate succeeded: $bad (if 'parks' is among them, the 'Park N still accepted' job for the rejected seed says the clause and what to run)"
            exit 1
          fi
          echo "Procgen invariants ok — every shard succeeded, and this commit accepts all sixteen checked-in parks."
