name: Deploy

# Builds the game and publishes dist/ to Cloudflare Workers (static assets)
# on every push to main. Can also be run by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# **Queue deploys; never cancel one.** `cancel-in-progress: true` here meant a
# second merge landing while the first deploy was still running *killed* it —
# and because this workflow is the only thing that publishes the site, the newer
# run could finish while the older one's cancellation left nothing behind but an
# ordinary-looking grey "cancelled" tick. On 29 August 2026 the live site sat on
# `0a5f0380` while `main` was five commits ahead, with no failure surfaced
# anywhere; it was found because Jim said "Deployed still has the old cat bus".
#
# A deploy is a **publish step, not a CI check**: unlike a test run, the last one
# must always actually run. So the group queues instead.
#
# GitHub still only keeps **one** run pending per group — a third merge arriving
# replaces the *pending* second one — which is fine and in fact what we want:
# the pending run that survives is the newest commit, and it contains the one it
# displaced. What must never be cancelled is the run that is already *deploying*,
# and that is exactly what `cancel-in-progress: false` protects.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        # Registry hiccups are common enough to be worth retrying.
        run: npm ci --fetch-retries=5 --fetch-retry-maxtimeout=120000

      - name: Build
        run: npm run build

      # `wrangler deploy` is idempotent, so a flaky-network failure is safe to
      # retry: attempt 2 only runs if attempt 1 failed.
      - name: Deploy to Cloudflare Workers
        id: deploy
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Deploy to Cloudflare Workers (retry)
        if: steps.deploy.outcome == 'failure'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
