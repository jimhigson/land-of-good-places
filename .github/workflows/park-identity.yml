name: Park identity

# **Is a supported park the same park on Linux and on a Mac?** Parks are
# accepted on one machine and shipped from another. With V8's own Math they
# were not: seeds 0, 2, 4, 8 and 11 grew different parks on arm64 (run
# 36947100024), because V8's transcendental functions differ by an ulp between
# x64 and arm64. src/core/deterministicMath.ts removes that, and since then all
# sixteen are identical to the bit (run 36950557531). This builds every supported seed at its
# recorded restart on both, and fails if any decision differs — a solve trace,
# the mesh set, or any mesh's vertex/instance count — reporting the worst
# position drift where the decisions agree (scripts/park-identity.mts,
# scripts/compare-park-identity.mts). Not yet a required check.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: park-identity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Park identity ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Hash every Math function over a fixed sweep
        run: |
          mkdir -p identity-math
          node --no-warnings scripts/math-determinism.mts identity-math/math.json

      - name: Build every supported park and record its identity
        run: |
          mkdir -p identity
          seq 0 15 | xargs -P 3 -I{} sh -c 'LGP_SEED={} node --no-warnings --import ./scripts/ts-extension-resolver-register.mjs scripts/park-identity.mts identity/{}.json 2>&1 | grep "^park-identity" || exit 255'
          ls identity

      - name: Upload identities
        uses: actions/upload-artifact@v4
        with:
          name: park-identity-${{ matrix.os }}
          path: |
            identity/
            identity-math/

  compare:
    name: Park identity
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Download identities
        uses: actions/download-artifact@v4

      # `native` is the control: V8's own functions, which differ between
      # x64 and arm64. If it ever stops differing, this step can no longer see
      # what the ports exist to remove, and it says so. `deterministic` is
      # src/core/deterministicMath.ts, and any difference there fails the job.
      - name: Math is the same on both platforms
        run: |
          node -e "
          const a=require('./park-identity-ubuntu-latest/identity-math/math.json'), b=require('./park-identity-macos-latest/identity-math/math.json');
          console.log(a.platform, a.node, a.v8, 'vs', b.platform, b.node, b.v8);
          let nativeDiffer=0, detDiffer=0;
          for (const k of Object.keys(a.native)) { const same=a.native[k]===b.native[k]; if(!same) nativeDiffer++; console.log('native        ', same?'same     ':'DIFFERENT', k); }
          for (const k of Object.keys(a.deterministic)) { const same=a.deterministic[k]===b.deterministic[k]; if(!same) detDiffer++; console.log('deterministic ', same?'same     ':'DIFFERENT', k); }
          console.log('native functions differing (control):', nativeDiffer, '| deterministic functions differing:', detDiffer);
          if (nativeDiffer===0) console.error('NOTE: the native control shows no difference on this pair of runners, so this run does not demonstrate the ports are needed.');
          if (detDiffer>0) { console.error('FAIL: src/core/deterministicMath.ts gave different bits on the two platforms'); process.exit(1); }"

      - name: The same park on both platforms
        run: node --no-warnings --import ./scripts/ts-extension-resolver-register.mjs scripts/compare-park-identity.mts park-identity-ubuntu-latest/identity park-identity-macos-latest/identity
