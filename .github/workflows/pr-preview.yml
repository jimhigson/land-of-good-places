name: PR preview

# Builds the client bundle only and publishes it as a Cloudflare Workers
# *version* — a real, load-testable preview URL that never touches production
# traffic — then comments the link on the PR. Updates the same comment on
# every push instead of piling up new ones.
#
# Deliberately skips the check suite: "Procgen invariants / build" (see
# procgen-invariants.yml) already runs the full `npm run build` gate on every
# PR and is a required check. That job takes 20-30 minutes; a preview only
# needs to *look* right, so this job does a bare `vite build` and is usually
# done in a couple of minutes. A red preview build here is a real build
# failure (syntax error, missing import) — it is not re-proving correctness
# the other job already owns.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  # PR conversation comments are the Issues API, not the Pull Requests API —
  # `pull-requests: write` alone gets `Resource not accessible by
  # integration` from `listComments`/`createComment`/`updateComment`.
  # Confirmed against a real failed run: the token only carried
  # `issues=read; pull_requests=read` even with pull-requests declared write.
  issues: write
  pull-requests: write

jobs:
  preview:
    name: Deploy PR preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        # Registry hiccups are common enough to be worth retrying — same
        # reasoning as deploy.yml; the counts live in `.npmrc`.
        run: pnpm install --frozen-lockfile

      # Client bundle only — see the on: comment above for why the check
      # suite is deliberately not run here.
      #
      # This used to have to say `pnpm exec vite build` explicitly, to reach
      # past a `build` script that would also have run 47 checks. Now that
      # `build` means only `vite build`, the plain script is the honest way to
      # say it — and it is the same command the deploy runs, which is the point.
      # The checks run in `checks.yml`, which is required before merge.
      - name: Build
        run: pnpm run build

      # `wrangler versions upload` publishes a new Worker *version* with its
      # own preview URL, without promoting it to production traffic — the
      # Cloudflare-native equivalent of a Vercel/Netlify preview deploy.
      # `preview_urls: true` in wrangler.jsonc is what makes a URL exist for
      # a version that was uploaded but never made the default (live) one.
      #
      # Cloudflare caps "alias name + script name" at 63 characters combined
      # (validation error 10021) — the full 40-char commit sha plus
      # "land-of-good-places" blows straight through that, confirmed by a
      # real failed run on this branch. 7 hex chars is git's own usual
      # "short sha" length and leaves this comfortably under the limit
      # (pr-<number>-<7 chars> + "land-of-good-places" is under 40 total).
      - name: Compute short commit sha
        id: sha
        run: echo "short=$(echo '${{ github.event.pull_request.head.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # `--preview-alias` pins the URL to `pr-<number>-<short-sha>-...`
      # instead of Cloudflare's own random version-id hash — Jim, 25 August
      # 2026, wanted the real git commit hash visible in the URL, not an
      # opaque Cloudflare-internal one, and a genuinely new URL on every
      # push (never one shared/reused link).
      - name: Upload preview version
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            versions upload
            --message "PR #${{ github.event.pull_request.number }}"
            --tag "pr-${{ github.event.pull_request.number }}"
            --preview-alias "pr-${{ github.event.pull_request.number }}-${{ steps.sha.outputs.short }}"

      # Cloudflare keeps every uploaded version live at its own URL forever
      # (confirmed: the Workers REST API's version-delete endpoint returns
      # 405 "wrong auth scheme" for this repo's token, and nothing has
      # granted it the extra permission that might fix that). Jim, 25 August
      # 2026, decided this is fine: "I don't care about the delete just make
      # sure all urls are unique and don't give me old ones." So this repo
      # does NOT try to clean up old versions — only ever hand out the URL
      # from the *current* push's own "Deploy PR preview" check/comment,
      # never reuse or guess an older one (see CLAUDE.md's own preview-link
      # rules above).

      - name: Comment preview link on PR
        uses: actions/github-script@v8
        with:
          script: |
            const output = `${{ steps.preview.outputs.command-output }}`;
            // `wrangler versions upload --preview-alias` prints TWO URLs: the
            // random version-id hash one first, then a line explicitly
            // labelled "Version Preview Alias URL:" — the stable one we
            // actually want. A bare "first workers.dev match" regex silently
            // grabs the hash line instead, so match the alias line by its
            // own label first and only fall back to the generic match if
            // that label isn't present (e.g. --preview-alias missing/failed).
            const aliasMatch = output.match(/Version Preview Alias URL:\s*(https:\/\/\S+)/);
            const anyMatch = output.match(/https:\/\/[a-zA-Z0-9.-]+\.workers\.dev\S*/);
            const url = aliasMatch ? aliasMatch[1] : anyMatch ? anyMatch[0] : null;
            const marker = "<!-- pr-preview-comment -->";
            const sha = context.payload.pull_request.head.sha;
            const shortSha = sha.slice(0, 7);
            const body = url
              ? `${marker}\n### 🎡 Preview deployed\n\n[Open the preview](${url})\n\nBuilt from commit [\`${shortSha}\`](${context.payload.repository.html_url}/commit/${sha}) — a fresh URL every push, so this link is only ever current while it's the *newest* comment on this PR.`
              : `${marker}\n### 🎡 Preview build finished\n\nBut no preview URL was found in the \`wrangler versions upload\` output — check the [workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId}) for details.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
