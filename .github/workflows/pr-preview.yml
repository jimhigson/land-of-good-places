name: PR preview

# Builds the client bundle only and publishes it as a Cloudflare Workers
# *version* — a real, load-testable preview URL that never touches production
# traffic — then comments the link on the PR. Updates the same comment on
# every push instead of piling up new ones.
#
# Deliberately skips the check suite: "Procgen invariants / build" (see
# procgen-invariants.yml) already runs the full `npm run build` gate on every
# PR and is a required check. That job takes 20-30 minutes; a preview only
# needs to *look* right, so this job does a bare `vite build` and is usually
# done in a couple of minutes. A red preview build here is a real build
# failure (syntax error, missing import) — it is not re-proving correctness
# the other job already owns.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  # PR conversation comments are the Issues API, not the Pull Requests API —
  # `pull-requests: write` alone gets `Resource not accessible by
  # integration` from `listComments`/`createComment`/`updateComment`.
  # Confirmed against a real failed run: the token only carried
  # `issues=read; pull_requests=read` even with pull-requests declared write.
  issues: write
  pull-requests: write

jobs:
  preview:
    name: Deploy PR preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        # Registry hiccups are common enough to be worth retrying — same
        # reasoning as deploy.yml.
        run: npm ci --fetch-retries=5 --fetch-retry-maxtimeout=120000

      # Client bundle only — see the on: comment above for why the check
      # suite is deliberately not run here.
      - name: Build
        run: npx vite build

      # `wrangler versions upload` publishes a new Worker *version* with its
      # own preview URL, without promoting it to production traffic — the
      # Cloudflare-native equivalent of a Vercel/Netlify preview deploy.
      # `preview_urls: true` in wrangler.jsonc is what makes a URL exist for
      # a version that was uploaded but never made the default (live) one.
      #
      # `--preview-alias` pins the URL to `pr-<number>-<short-sha>-...`
      # instead of Cloudflare's own random version-id hash — Jim, 25 August
      # 2026, wanted the real git commit hash visible in the URL, not an
      # opaque Cloudflare-internal one. Every push still gets its own new
      # URL (the sha changes every commit), which is deliberate: Jim wants
      # one unique subdomain per deploy, not one shared/reused link. The
      # "Delete superseded preview versions" step right after this one is
      # what keeps an old push's URL from serving stale code forever once a
      # newer one exists — the alias alone does not do that.
      - name: Upload preview version
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            versions upload
            --message "PR #${{ github.event.pull_request.number }}"
            --tag "pr-${{ github.event.pull_request.number }}"
            --preview-alias "pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}"

      # Cloudflare keeps every uploaded version live at its own URL forever
      # unless something deletes it — that's the exact bug Jim reported
      # ("that's on you to fix"): an old push's preview URL going on serving
      # its own frozen build with no error, long after a newer push exists.
      # `wrangler` has no `versions delete` subcommand, so this calls the
      # Workers REST API directly: list every version tagged for this PR,
      # then delete all but the one just uploaded. Never touches versions
      # from other PRs (each has its own tag) or the live production
      # deployment (versions are separate from deployments; deleting one
      # cannot affect what's serving landofgoodplaces.blockstack.ing).
      - name: Delete superseded preview versions for this PR
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCRIPT_NAME: land-of-good-places
          PR_TAG: pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          OUTPUT='${{ steps.preview.outputs.command-output }}'
          KEEP_ID=$(printf '%s' "$OUTPUT" | grep -oE 'Worker Version ID: [0-9a-f-]+' | head -1 | awk '{print $NF}')
          if [ -z "$KEEP_ID" ]; then
            echo "Could not find the just-uploaded version's own ID in wrangler's output — not deleting anything this run."
            exit 0
          fi
          echo "Keeping version $KEEP_ID (just uploaded), tag=$PR_TAG"

          LIST_JSON=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/versions")
          echo "$LIST_JSON" | jq -c '{success, count: (.result.items | length)}'

          OLD_IDS=$(echo "$LIST_JSON" | jq -r --arg tag "$PR_TAG" --arg keep "$KEEP_ID" \
            '.result.items[]? | select(.metadata.tag == $tag and .id != $keep) | .id')

          if [ -z "$OLD_IDS" ]; then
            echo "No superseded versions found for $PR_TAG (first push on this PR, or tag field didn't match — see the JSON above)."
            exit 0
          fi

          for VID in $OLD_IDS; do
            echo "Deleting superseded version $VID"
            STATUS=$(curl -sS -o /tmp/delete-response.json -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/versions/$VID")
            echo "  HTTP $STATUS: $(cat /tmp/delete-response.json)"
          done

      - name: Comment preview link on PR
        uses: actions/github-script@v8
        with:
          script: |
            const output = `${{ steps.preview.outputs.command-output }}`;
            // `wrangler versions upload --preview-alias` prints TWO URLs: the
            // random version-id hash one first, then a line explicitly
            // labelled "Version Preview Alias URL:" — the stable one we
            // actually want. A bare "first workers.dev match" regex silently
            // grabs the hash line instead, so match the alias line by its
            // own label first and only fall back to the generic match if
            // that label isn't present (e.g. --preview-alias missing/failed).
            const aliasMatch = output.match(/Version Preview Alias URL:\s*(https:\/\/\S+)/);
            const anyMatch = output.match(/https:\/\/[a-zA-Z0-9.-]+\.workers\.dev\S*/);
            const url = aliasMatch ? aliasMatch[1] : anyMatch ? anyMatch[0] : null;
            const marker = "<!-- pr-preview-comment -->";
            const sha = context.payload.pull_request.head.sha;
            const shortSha = sha.slice(0, 7);
            const body = url
              ? `${marker}\n### 🎡 Preview deployed\n\n[Open the preview](${url})\n\nBuilt from commit [\`${shortSha}\`](${context.payload.repository.html_url}/commit/${sha}) — the URL itself changes on every push (the commit hash is in it) and the previous push's preview version is deleted, so there is never an old link quietly serving stale code. **Open it in a private/incognito window** — this box has served many dev builds from many ports over its lifetime, and a stale service worker or save from an unrelated earlier visit can silently serve old content with no error (see CLAUDE.md's "A stale service worker will waste your hour").`
              : `${marker}\n### 🎡 Preview build finished\n\nBut no preview URL was found in the \`wrangler versions upload\` output — check the [workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId}) for details.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
