name: Procgen invariants

# Proves the generated park is placed sanely — no wall crossing another wall or
# the railway, no tree growing through a tree, no lamp standing in anything,
# every path lit and every doormat usable — across the canonical seed and four
# of the seeds `npm run sweep:seeds` passes.
#
# This is a required check on main. Any change to the procedural generation is
# expected to extend `test/procgen/invariants.ts` in the same PR — see
# CLAUDE.md, "Expanding the procedural generation".
#
# ## Two things here are load-bearing for DEPLOYS, not just for this check
#
# `deploy.yml` triggers on `workflow_run` of this workflow, so publishing the
# live site now depends on this file in two specific ways:
#
#  1. **The `name:` above.** `workflow_run` matches on a workflow's *name*, not
#     its filename. Rename it and `deploy.yml` stops being triggered at all —
#     and nothing goes red, because there is no run to be red. Deploys just
#     quietly stop, which is the exact shape of the 29 August 2026 outage.
#  2. **`push: branches: [main]`, unfiltered.** Adding a `paths:` filter here
#     would mean a commit touching only unfiltered paths never runs this
#     workflow, never triggers `deploy.yml`, and never reaches the live site.
#
# Change either and change `deploy.yml` in the same edit. The backstop if
# somebody does not is `live-version.yml`, which asks the live site what commit
# it is serving on a half-hourly cron and opens an issue when it is behind — it
# never asks whether a run succeeded, so it cannot be fooled by a run that does
# not exist.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: procgen-invariants-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Two parallel jobs rather than one. They used to run sequentially in a single
  # 20-minute budget — `test:procgen` first, then the full `npm run build` — and
  # once the train started solving with the generic rail search (a ~1.5 s solve
  # that every park-building check now pays, up from ~40 ms) the two together
  # crept past 20 minutes on a slow runner: `test:procgen` alone ate ~5 of the
  # 20, starving the build. Splitting them gives each its own runner and its own
  # budget, halves the wall clock, and makes a failure read plainly as "an
  # invariant broke" vs "a check broke". They each do their own `npm ci`; the
  # extra install is cheap next to what it unblocks.
  invariants:
    name: Procgen invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        # Registry hiccups are common enough to be worth retrying — same
        # reasoning as deploy.yml; the counts live in `.npmrc`.
        run: pnpm install --frozen-lockfile

      # The invariant suite on its own, so a failure reads as "an invariant
      # broke" rather than being buried in the build log.
      - name: Procgen invariant suite
        run: pnpm run test:procgen

  build:
    name: Build and checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The full gate: `tsc`, every `check:*` (including `check:park`'s six
      # invariants and the canonical-seed ratchet, and `check:park-boot`), and
      # `vite build`. Heavier since the generic train solve, so it gets the whole
      # budget to itself with headroom.
      - name: Build
        run: pnpm run build
