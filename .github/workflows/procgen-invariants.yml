name: Procgen invariants

# Proves the generated park is placed sanely — no wall crossing another wall or
# the railway, no tree growing through a tree, no lamp standing in anything,
# every path lit and every doormat usable — on every seed whose accepted restart
# is recorded in `src/world/acceptedRestarts.ts` (0..15 and the pool), each
# built at that restart: the second line behind the root acceptance loop
# (docs/design/STRUCTURAL-BACKTRACKING.md).
#
# This is a required check on main. Any change to the procedural generation is
# expected to extend `test/procgen/invariants.ts` in the same PR — see
# CLAUDE.md, "Expanding the procedural generation".
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: procgen-invariants-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # **Sharded, gated by one aggregator named `Procgen invariants`.** The suite
  # measures every recorded park (25 of them since the root acceptance loop,
  # against 5 before), about 5.5 minutes per five parks on a runner — one job
  # could not hold it under its cap. So the seed files are split over runners
  # with vitest's own `--shard`, the pool sweeps run on their own runner, and
  # the job GitHub gates on (`Procgen invariants`, a required check matched BY
  # NAME) is the aggregator at the bottom, which fails unless every part
  # succeeded — the same shape as `checks.yml`.
  suite:
    name: Procgen invariants shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # A shard holds five or six parks; see the history of this number in the
    # aggregator's comment. The watchdog reads it (`--job suite`).
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Procgen invariant suite, this shard
        env:
          LGP_PROCGEN_SHARD: ${{ matrix.shard }}/5
        run: pnpm run test:procgen:watchdog

  pool:
    name: Procgen invariants pool
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: The front gate opens, on every seed in the pool
        run: pnpm run check:gateway

      - name: check:park, on every seed in the pool
        run: pnpm run check:park-pool

  # **Do not rename this job.** `Procgen invariants` is a required status check
  # on `main`; a required check is matched by name, so renaming it stops it
  # gating merges without anything going red.
  #
  # History of the cap: 15 → 25 by #510 when the single job took ~14 minutes;
  # now the work is split and this job only reads its upstream results.
  invariants:
    name: Procgen invariants
    needs: [suite, pool]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard of the suite and the pool sweeps succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          count=$(echo "$NEEDS" | jq 'length')
          if [ "$count" != "2" ]; then
            echo "::error::expected 2 upstream jobs (suite, pool), saw $count — the aggregator is measuring nothing"
            exit 1
          fi
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::not every part of the procgen gate succeeded: $bad"
            exit 1
          fi
          echo "Procgen invariants ok — every shard and the pool sweeps succeeded."
