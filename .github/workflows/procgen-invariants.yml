name: Procgen invariants

# Proves the generated park is placed sanely — no wall crossing another wall or
# the railway, no tree growing through a tree, no lamp standing in anything,
# every path lit and every doormat usable — on every supported seed (0..15),
# each built at the restart the root acceptance loop accepts for it at this
# source (scripts/lib/acceptedPark.mts; nothing committed, so nothing to go
# stale): the second line behind that loop (docs/design/STRUCTURAL-BACKTRACKING.md).
#
# This is a required check on main. Any change to the procedural generation is
# expected to extend `test/procgen/invariants.ts` in the same PR — see
# CLAUDE.md, "Expanding the procedural generation".
on:
  # Called from ci.yml, behind a `needs:` edge on the Parks build in the same
  # run, so the parks it restores are already in this run's cache.
  workflow_call:

# No `concurrency:` here: ci.yml, the caller, owns it.

permissions:
  contents: read

jobs:
  # **Sharded, gated by one aggregator named `Procgen invariants`.** The suite
  # measures every recorded park (16 since the root acceptance loop,
  # against 5 before), about 5.5 minutes per five parks on a runner — one job
  # could not hold it under its cap. So the files are split over runners by
  # the map in `test/procgenShards.ts`, placed by measured time (vitest's own
  # `--shard` splits by count, and once put a 20-minute file on one runner
  # beside two seeds: red on main at 7c8faaf0), and the job GitHub gates on (`Procgen invariants`, a required check matched BY
  # NAME) is the aggregator in `ci.yml`, which fails unless every part
  # succeeded — the same shape as `checks.yml`.
  #
  # There used to be a `pool` job here running `check:gateway` and
  # `check:park-pool` over all sixteen seeds, each building every park again.
  # It was cancelled at its 25-minute cap on every run once the pool was the
  # sixteen supported seeds. Both questions are now asked by each seed's own
  # file, on the park it has already built (`registerParkInvariants`), and
  # `check:seed-coverage` asserts that every pool seed's file asks them.
  suite:
    name: Procgen invariants shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # Every shard measured well inside this (test/procgenShards.ts); the
    # watchdog reads it (`--job suite`).
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Exactly 1..PROCGEN_SHARDS.length — check:seed-coverage parses both.
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore the accepted parks
        uses: ./.github/actions/restore-parks

      - name: Procgen invariant suite, this shard
        env:
          LGP_PROCGEN_SHARD: ${{ matrix.shard }}
        run: pnpm run test:procgen:watchdog

# The `Procgen invariants` aggregator — the required status check — is in
# `ci.yml`, the caller, at the top level: a job inside a called workflow is
# reported as "<caller job> / <job>", which would match no required check.
