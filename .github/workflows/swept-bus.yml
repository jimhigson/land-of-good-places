name: Swept bus

# Sweeps the cat bus's **drawn** body along its arrival run and asks which
# **drawn** rail-race trestle posts it reaches, on all sixteen seeds in
# `parkSeedPool.ts`. Ratcheted against `scripts/swept-bus-baseline.mts`, so it
# can gate a park that is red today (364 posts across the pool) while stage 3
# drives that number to zero.
#
# ## Why this is its own workflow rather than a step in `checks.yml`
#
# Measured: **8 s per seed**, 56 s wall clock across sixteen on a 14-core Mac.
# A GitHub runner has far fewer cores and this script's own worker count is
# `cpus - 1`, so the honest CI estimate is **two to five minutes**, run mostly
# serially.
#
# `checks.yml` is already at ~25 minutes against its own 30-minute cap. A job
# killed by `timeout-minutes` reports as **`cancelled`**, so nothing goes red —
# that is how this project lost a deploy on 29 August. Adding minutes to that
# chain knowingly is the thing CLAUDE.md tells you not to do, so this takes
# `coplanar.yml`'s shape instead: its own runner, its own budget, and a failure
# that reads plainly as "the bus drives through the ride" rather than being
# buried in a 25-minute log. It runs *beside* the checks, so it costs nothing on
# the critical path.
#
# The engineering brief asked for this to go in the `check` chain. That
# instruction was written before the wall clock was measured; the measurement is
# what changed the answer, and it is recorded above so the next person can
# re-decide with the same number rather than re-measuring.
#
# ## This must be made a required status check on `main`
#
# It is not one automatically, and adding it needs a repository setting only Jim
# can make — CLAUDE.md's "report, do not act" covers exactly this. Until it is
# added, this workflow runs and goes red but **does not block a merge**.
#
# **Do not rename this job.** A required status check is matched by name, so a
# rename stops it gating merges with nothing going red.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: swept-bus-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swept-bus:
    name: Swept bus
    runs-on: ubuntu-latest
    # Generous against a measured 56 s locally and an estimated 2-5 minutes
    # here: a runner having a slow day should say so by being slow, not by
    # being cancelled.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sweep the bus against the drawn ride
        run: pnpm run check:swept-bus
