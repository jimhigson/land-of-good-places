name: Update adoption

# Proves the one thing issue #341 was: that a **returning player** — somebody
# whose browser already has our service worker installed — is executing the
# newest deployed bundle after a single ordinary reload, with nobody pressing
# anything, and that a deploy landing while she is *playing* still waits to be
# asked instead of yanking the page out from under her.
#
# It gets its own workflow because it needs a browser, and the "Build and
# checks" job (procgen-invariants.yml) runs on a runner with none. Folding it
# into `npm run build` would mean either failing everywhere or being quietly
# skipped — and a check that is quietly skipped is worse than no check, per
# CLAUDE.md. So the browser is installed here, on purpose, in the one job that
# needs it.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: update-adoption-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update-adoption:
    name: A reload gets the new build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        # Registry hiccups are common enough to be worth retrying — same
        # reasoning as deploy.yml; the counts live in `.npmrc`.
        run: pnpm install --frozen-lockfile

      # `playwright-core` ships the driver but not the browser binaries.
      - name: Install Chromium
        run: pnpm exec playwright-core install --with-deps chromium

      # Builds the tree twice (the two builds differ only in APP_VERSION, which
      # is enough to change every hashed filename), serves them from one static
      # server whose document root it flips, and drives one persistent profile
      # through the trace on the issue.
      - name: Update adoption check
        run: pnpm run check:update-adoption
